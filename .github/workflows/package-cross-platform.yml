name: npm six-platform installation checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-six-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install:
    name: npm ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15-intel, macos-15]
    defaults:
      run:
        working-directory: opencodex-runtime
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.20.0
      - name: Verify native Node architecture
        run: |
          node -e 'if(process.arch !== process.env.RUNNER_ARCH.toLowerCase()) throw Error("Unexpected Node architecture")'
      - name: Install npm package dependencies including bundled Bun
        run: npm install --no-audit --no-fund
      - name: Build dashboard using bundled Bun
        run: npm run build:gui
      - name: Windows package installation, restart and removal
        if: runner.os == 'Windows'
        run: node scripts/windows-package-smoke.mjs
      - name: Linux package installation, restart and removal
        if: runner.os == 'Linux'
        run: node scripts/linux-package-smoke.mjs
      - name: macOS package installation, restart and removal
        if: runner.os == 'macOS'
        run: node scripts/macos-package-smoke.mjs
