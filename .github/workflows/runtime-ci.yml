name: Server Windows and macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} checks ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: opencodex-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Privacy scan
        run: bun run privacy:scan
      - name: Install dashboard dependencies
        working-directory: opencodex-runtime/gui
        run: bun install --frozen-lockfile
      - name: Build dashboard
        working-directory: opencodex-runtime/gui
        run: bun run build
      - name: Run macOS runtime tests
        if: runner.os == 'macOS'
        run: bun scripts/test.ts tests --shard=${{ matrix.shard }}/4
      - name: Verify Windows tray launch
        if: runner.os == 'Windows' && matrix.shard == 4
        timeout-minutes: 3
        run: bun scripts/test.ts tests/windows-tray.test.ts
      - name: Run Windows runtime tests
        if: runner.os == 'Windows'
        run: bun scripts/test-file-shard.ts --shard=${{ matrix.shard }}/4
