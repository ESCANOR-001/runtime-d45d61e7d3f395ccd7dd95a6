name: Linux full regression and npm installation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-deep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: ${{ matrix.os }} runtime ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: opencodex-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install runtime dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Privacy scan
        run: bun run privacy:scan
      - name: Install dashboard dependencies
        working-directory: opencodex-runtime/gui
        run: bun install --frozen-lockfile
      - name: Build dashboard
        working-directory: opencodex-runtime/gui
        run: bun run build
      - name: All runtime tests including nested suites
        run: bun scripts/test-file-shard.ts --shard=${{ matrix.shard }}/4
      - name: Dashboard tests
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: opencodex-runtime/gui
        run: bun run test
      - name: Dashboard lint
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: opencodex-runtime/gui
        run: bun run lint
      - name: Install Linux Secret Service dependencies
        if: ${{ !cancelled() && matrix.shard == 1 }}
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-x11 gnome-keyring
      - name: Real Linux Secret Service round trip
        if: ${{ !cancelled() && matrix.shard == 1 }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          keyring_home="$(mktemp -d)"
          runtime_dir="$(mktemp -d)"
          cleanup() { rm -rf -- "$keyring_home" "$runtime_dir"; }
          trap cleanup EXIT
          chmod 700 "$keyring_home" "$runtime_dir"
          HOME="$keyring_home" XDG_RUNTIME_DIR="$runtime_dir" dbus-run-session -- bash -euo pipefail -c '
            od -An -N32 -tx1 /dev/urandom |
              tr -d "[:space:]" |
              gnome-keyring-daemon --unlock --components=secrets >/dev/null
            bun run scripts/keyring-smoke.ts
          '
      - name: Install documentation dependencies
        if: ${{ !cancelled() && matrix.shard == 2 }}
        working-directory: opencodex-runtime/docs-site
        run: bun install --frozen-lockfile
      - name: Build documentation
        if: ${{ !cancelled() && matrix.shard == 2 }}
        working-directory: opencodex-runtime/docs-site
        run: bun run build
  npm-install:
    name: ${{ matrix.os }} npm Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: opencodex-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup Node without standalone Bun
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install via npm including bundled Bun
        run: npm install --no-audit --no-fund
      - name: Build dashboard using bundled Bun
        run: npm run build:gui
      - name: Pack install launch restart and uninstall
        run: node scripts/linux-package-smoke.mjs
