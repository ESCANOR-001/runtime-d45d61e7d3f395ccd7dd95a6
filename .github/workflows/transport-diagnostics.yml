name: Focused transport diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    defaults:
      run:
        working-directory: opencodex-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compare native WebSocket clients
        run: bun tests/helpers/websocket-size-probe.ts
      - name: Check oversized response behavior
        env:
          REMODEX_TEST_TRANSPORT_DIAGNOSTICS: "1"
        run: bun scripts/test.ts tests/android-remote-runtime-compatibility.test.ts
      - name: Compare transport without realm isolation
        if: ${{ !cancelled() }}
        env:
          REMODEX_TEST_TRANSPORT_DIAGNOSTICS: "1"
        run: bun test tests/android-remote-runtime-compatibility.test.ts
      - name: Check history worker lifecycle
        if: ${{ !cancelled() }}
        run: bun test tests/codex-history-job.test.ts
