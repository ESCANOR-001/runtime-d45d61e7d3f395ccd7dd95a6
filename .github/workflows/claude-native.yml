name: Claude native helper compatibility

on:
  push:
    paths:
      - 'claude-desktop-bridge/native/**'
      - 'claude-desktop-bridge/chat/desktop-*.mjs'
      - 'claude-desktop-bridge/chat/native-helper.mjs'
      - 'claude-desktop-bridge/tests/native-desktop.test.mjs'
      - '.github/workflows/claude-native.yml'
  pull_request:
    paths:
      - 'claude-desktop-bridge/native/**'
      - 'claude-desktop-bridge/chat/desktop-*.mjs'
      - 'claude-desktop-bridge/chat/native-helper.mjs'
      - 'claude-desktop-bridge/tests/native-desktop.test.mjs'
      - '.github/workflows/claude-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Native interface and shared logic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --manifest-path claude-desktop-bridge/native/Cargo.toml --check
      - name: Native static checks
        run: cargo +stable clippy --locked --manifest-path claude-desktop-bridge/native/Cargo.toml --all-targets -- -D warnings
      - name: Native protocol tests
        run: cargo +stable test --locked --manifest-path claude-desktop-bridge/native/Cargo.toml
      - name: Shared chat and process tests
        run: node --test claude-desktop-bridge/tests/native-desktop.test.mjs
      - name: Build native helper
        run: cargo +stable build --release --locked --manifest-path claude-desktop-bridge/native/Cargo.toml
      - name: Native executable protocol smoke
        run: node claude-desktop-bridge/native/smoke.mjs
