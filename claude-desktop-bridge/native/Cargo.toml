[package]
name = "remodex-desktop-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.21"

[profile.release]
strip = true
lto = "thin"
